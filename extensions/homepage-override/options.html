<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Home Button Options</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 12px; min-width: 320px; }
      input { width: 100%; box-sizing: border-box; padding: 6px; margin: 8px 0; }
      #status { color: green; font-size: 12px; }
    </style>
  </head>
  <body>
    <label for="url">Home button opens:</label>
    <input id="url" type="url" placeholder="https://duckduckgo.com/" />
    <button id="save">Save</button>
    <span id="status"></span>
    <script src="options.js"></script>
  </body>
</html>
