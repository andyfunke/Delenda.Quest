name: Deploy SSH gateway

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "packages/ssh-gateway/**"
      - "scripts/test-native-ssh-gateway.sh"
      - "tests/fixtures/ssh-gateway-api.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-ssh-gateway.yml"

permissions:
  contents: read

concurrency:
  group: delenda-ssh-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ssh-production
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Install locked dependencies
        run: npm run install:ci

      - name: Typecheck and bundle the gateway
        run: npm run typecheck && npm run build:ssh-gateway

      - name: Run cognitive Nexus and SSH attestation contracts
        run: bash scripts/test-substrate.sh

      - name: Prove a native SSH command through the production image
        run: |
          docker build --file packages/ssh-gateway/Dockerfile --tag delenda-ssh-gateway:test .
          bash scripts/test-native-ssh-gateway.sh delenda-ssh-gateway:test

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy public TCP gateway
        run: flyctl deploy --remote-only --config packages/ssh-gateway/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify the live SSH listener
        run: |
          flyctl status --config packages/ssh-gateway/fly.toml
          for attempt in {1..12}; do
            if timeout 8 ssh-keyscan -p 22 ssh.delenda.quest 2>/dev/null | grep -q '^ssh.delenda.quest'; then
              exit 0
            fi
            if [[ "${attempt}" -lt 12 ]]; then
              sleep 5
            fi
          done
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
