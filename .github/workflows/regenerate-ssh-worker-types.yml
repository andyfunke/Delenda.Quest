name: Regenerate SSH Worker types

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/regenerate-ssh-worker-types.yml"
      - "wrangler.jsonc"
      - "cloudflare/.dev.vars.example"
      - "worker-configuration.d.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'agent/production-ssh-daemon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/production-ssh-daemon
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
      - run: npm run install:ci
      - run: npm run cloudflare:types
      - name: Commit canonical generated types
        run: |
          git config user.name "Delenda autonomous operator"
          git config user.email "actions@users.noreply.github.com"
          git add worker-configuration.d.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate Worker types for SSH authority"
          git push origin HEAD:agent/production-ssh-daemon
