name: Classify Cloudflare credential

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/classify-cloudflare-credential.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    if: github.head_ref == 'agent/production-ssh-daemon'
    runs-on: ubuntu-latest
    env:
      CF_CREDENTIAL: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Report credential shape without disclosing it
        run: |
          set -euo pipefail
          trimmed="$(printf '%s' "$CF_CREDENTIAL" | tr -d '\r\n' | sed -e 's/^Bearer[[:space:]]*//' -e 's/^"//' -e 's/"$//')"
          echo "RAW_LENGTH=${#CF_CREDENTIAL}"
          echo "TRIMMED_LENGTH=${#trimmed}"
          if [[ "$trimmed" =~ ^[0-9a-fA-F]{32}$ ]]; then echo "SHAPE=HEX32"; else echo "SHAPE=OTHER"; fi
          if [[ "$trimmed" == "$CF_ACCOUNT_ID" ]]; then echo "MATCHES_ACCOUNT_ID=true"; else echo "MATCHES_ACCOUNT_ID=false"; fi
          if [[ "$trimmed" =~ [[:space:]] ]]; then echo "CONTAINS_WHITESPACE=true"; else echo "CONTAINS_WHITESPACE=false"; fi
          code="$(curl -sS -o /tmp/verify.json -w '%{http_code}' -H "Authorization: Bearer ${trimmed}" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          echo "SANITIZED_VERIFY_HTTP=$code"
          echo "SANITIZED_VERIFY_SUCCESS=$(jq -r '.success // false' /tmp/verify.json)"
          echo "SANITIZED_VERIFY_ERRORS=$(jq -c '.errors // []' /tmp/verify.json)"
