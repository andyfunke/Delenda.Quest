name: Apply agent SSH implementation

on:
  push:
    branches:
      - agent/production-ssh-daemon
    paths:
      - ".github/agent/ssh-implementation.patch.gz.b64"
      - ".github/workflows/apply-agent-ssh.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-ssh-daemon
      - name: Apply implementation
        run: |
          base64 -d .github/agent/ssh-implementation.patch.gz.b64 | gzip -d > /tmp/ssh-implementation.patch
          patch -p1 < /tmp/ssh-implementation.patch
          rm -f .github/agent/ssh-implementation.patch.gz.b64
          rm -f .github/workflows/apply-agent-ssh.yml
      - name: Commit implementation
        run: |
          git config user.name "delenda-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Implement production native SSH transport"
          git push origin HEAD:agent/production-ssh-daemon
