name: Production contract

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use the project Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate the Cloudflare artifact
        run: npm run cloudflare:validate

      - name: Run rules tests
        run: bash scripts/test-rules.sh

      - name: Run Ava tests
        run: bash scripts/test-ava.sh

      - name: Run rendered and plumbing tests
        run: node --test tests/rendered-html.test.mjs tests/cloudflare-plumbing.test.mjs

  live-production-acceptance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use the project Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0

      - name: Install locked dependencies
        run: npm ci

      - name: Prove delenda.quest serves the deployed contract
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if npm run test:live; then
              exit 0
            fi
            if [[ "${attempt}" -lt 12 ]]; then
              sleep 10
            fi
          done
          exit 1
