name: Production acceptance

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use the project Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate the Cloudflare artifact
        run: npm run cloudflare:validate

      - name: Run rules tests
        run: bash scripts/test-rules.sh

      - name: Run Ava tests
        run: bash scripts/test-ava.sh

      - name: Run rendered and plumbing tests
        run: node --test tests/rendered-html.test.mjs tests/cloudflare-plumbing.test.mjs

  verify-live-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use the project Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0

      - name: Prove the custom domain serves the deployed contract
        run: npm run test:live
