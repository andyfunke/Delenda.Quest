name: Cloudflare production

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use the project Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate the Cloudflare artifact
        run: npm run cloudflare:validate

      - name: Run rules tests
        run: bash scripts/test-rules.sh

      - name: Run Ava tests
        run: bash scripts/test-ava.sh

      - name: Run rendered and plumbing tests
        run: node --test tests/rendered-html.test.mjs tests/cloudflare-plumbing.test.mjs

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use the project Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Resolve the Worker serving delenda.quest
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          expected="$(
            node -e 'console.log(JSON.parse(require("node:fs").readFileSync("cloudflare/wrangler.jsonc","utf8")).name)'
          )"
          domains="$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=delenda.quest"
          )"
          service="$(
            printf '%s' "${domains}" |
              jq --exit-status --raw-output \
                '.result[] | select(.hostname == "delenda.quest") | .service'
          )"
          if [[ -z "${service}" || "${service}" != "${expected}" ]]; then
            echo "::error::Refusing deployment: delenda.quest is attached to ${service:-no Worker}, not ${expected}."
            exit 1
          fi
          echo "Verified delenda.quest routes to the configured Worker service ${service}."

      - name: Build the production Worker artifact
        run: npm run build

      - name: Deploy the verified production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cloudflare/wrangler.jsonc

      - name: Prove the custom domain serves the deployed contract
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if npm run test:live; then
              exit 0
            fi
            if [[ "${attempt}" -lt 12 ]]; then
              sleep 10
            fi
          done
          exit 1
