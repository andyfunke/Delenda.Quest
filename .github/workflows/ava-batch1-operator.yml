name: Ava Batch 1 Operator

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  snapshot:
    if: github.head_ref == 'automation/ava-batch1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/ava-batch1
          fetch-depth: 0
      - name: Repository preflight
        run: |
          set -euo pipefail
          git rev-parse --show-toplevel
          git status --short --branch
          git log -12 --oneline
          test -z "$(git status --short)"
      - name: Package repository snapshot
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/delenda-quest-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: delenda-quest-source
          path: /tmp/delenda-quest-source.tgz
          if-no-files-found: error
          retention-days: 1
