name: Audit SSH deployment access

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/audit-ssh-deployment-access.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'agent/production-ssh-daemon'
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_SECRET: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CF_ZONE_VAR: ${{ vars.CLOUDFLARE_ZONE_ID }}
      RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_ACCOUNT_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE_ID }}
    steps:
      - name: Report non-secret actuator availability
        run: |
          set -euo pipefail
          present(){ if [[ -n "$2" ]]; then echo "$1=PRESENT"; else echo "$1=ABSENT"; fi; }
          present CLOUDFLARE_API_TOKEN "$CF_TOKEN"
          present CLOUDFLARE_ACCOUNT_ID "$CF_ACCOUNT_SECRET$CF_ACCOUNT_VAR"
          present CLOUDFLARE_ZONE_ID "$CF_ZONE_SECRET$CF_ZONE_VAR"
          present RAILWAY_TOKEN "$RAILWAY_PROJECT_TOKEN"
          present RAILWAY_API_TOKEN "$RAILWAY_ACCOUNT_TOKEN"
          present RAILWAY_PROJECT_ID "$RAILWAY_PROJECT"
          present RAILWAY_ENVIRONMENT_ID "$RAILWAY_ENVIRONMENT"
          present RAILWAY_SERVICE_ID "$RAILWAY_SERVICE"
