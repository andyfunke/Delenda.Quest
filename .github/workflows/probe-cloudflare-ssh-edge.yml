name: Probe Cloudflare SSH edge

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/probe-cloudflare-ssh-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'agent/production-ssh-daemon'
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Query zone and Spectrum capability
        run: |
          set -euo pipefail
          api(){ curl -fsS -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" "$@"; }
          zones="$(api "https://api.cloudflare.com/client/v4/zones?name=delenda.quest&account.id=${CF_ACCOUNT_ID}")"
          zone_id="$(jq -r '.result[0].id // empty' <<<"$zones")"
          test -n "$zone_id"
          echo "ZONE_ID=$zone_id"
          echo "PLAN=$(jq -r '.result[0].plan.name // "unknown"' <<<"$zones")"
          spectrum_status=0
          spectrum="$(api "https://api.cloudflare.com/client/v4/zones/${zone_id}/spectrum/apps" 2>/tmp/spectrum-error)" || spectrum_status=$?
          if [[ $spectrum_status -eq 0 ]]; then
            echo "SPECTRUM_API=AVAILABLE"
            jq -r '.result[]? | "SPECTRUM_APP protocol=\(.protocol) edge=\(.dns.name):\(.edge_ips.type // "dynamic") origin=\(.origin_dns.name // .origin_direct[0] // "unknown")"' <<<"$spectrum"
          else
            echo "SPECTRUM_API=UNAVAILABLE"
            sed 's/[[:cntrl:]]//g' /tmp/spectrum-error | head -c 1000
            echo
          fi
          dns="$(api "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=ssh.delenda.quest")"
          count="$(jq -r '.result | length' <<<"$dns")"
          echo "SSH_DNS_RECORDS=$count"
          jq -r '.result[]? | "SSH_DNS type=\(.type) content=\(.content) proxied=\(.proxied)"' <<<"$dns"
